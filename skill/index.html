  <script>
    (() => {
      'use strict';
      const root = document.documentElement;
      if (!root.lang) root.lang = 'zh-Hant';

      // 深淺色：預設跟隨系統；按鈕可切換，偏好只存在這台瀏覽器
      const KEY = 'vs-tutorial-theme';
      const button = document.getElementById('theme-toggle');
      const prefersLight = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
      const current = () => root.dataset.theme || (prefersLight && prefersLight.matches ? 'light' : 'dark');
      const paint = () => {
        const theme = current();
        button.textContent = theme === 'dark' ? '☼' : '☾';
        button.setAttribute('aria-label', theme === 'dark' ? '切換為淺色模式' : '切換為深色模式');
      };
      if (!root.dataset.theme) {
        try { const saved = localStorage.getItem(KEY); if (saved === 'light' || saved === 'dark') root.dataset.theme = saved; } catch (error) { /* 儲存受限時照系統設定顯示 */ }
      }
      button.addEventListener('click', () => {
        const next = current() === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem(KEY, next); } catch (error) { /* 只在本次瀏覽生效 */ }
        paint();
      });
      if (prefersLight && prefersLight.addEventListener) prefersLight.addEventListener('change', paint);
      new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
      paint();

      // 章節導覽：標示目前閱讀的章節
      const list = document.querySelector('.toc ol');
      const links = Array.from(document.querySelectorAll('.toc a'));
      const sections = links.map(link => document.getElementById(link.getAttribute('href').slice(1))).filter(Boolean);
      if (!('IntersectionObserver' in window) || !sections.length) return;
      const visible = new Set();
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => entry.isIntersecting ? visible.add(entry.target.id) : visible.delete(entry.target.id));
        const active = sections.find(section => visible.has(section.id));
        links.forEach(link => {
          const on = Boolean(active) && link.getAttribute('href') === '#' + active.id;
          if (on) link.setAttribute('aria-current', 'location'); else link.removeAttribute('aria-current');
          if (on && list.scrollWidth > list.clientWidth) list.scrollTo({ left: Math.max(0, link.parentElement.offsetLeft - 24) });
        });
      }, { rootMargin: '-90px 0px -55% 0px' });
      sections.forEach(section => observer.observe(section));
    })();
  </script>
